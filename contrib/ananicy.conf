# aranicy default configuration (superset of ananicy.d/ananicy.conf).
# key = value; lines starting with # are comments.

# Seconds between optional drift-corrector passes (0 disables; the eBPF event
# path is authoritative). Delta-based: only processes whose policy drifted
# are touched, never a full re-apply scan.
check_freq = 60

# Which rule file kinds to load.
cgroup_load = true
type_load = true
rule_load = true

# Per-action gates.
apply_nice = true
apply_latnice = true
apply_ionice = true
apply_sched = true
apply_oom_score_adj = true
apply_cgroup = true
apply_cpuset = true
apply_autogroup = true

# cgroup v2: skip cgroup moves for realtime tasks and move them to the root
# cgroup (ananicy-cpp parity workaround).
cgroup_realtime_workaround = true

# Logging: trace|debug|info|warn|error|critical
loglevel = info
# One line per applied rule (noisy; off by default).
log_applied_rule = false

# Dynamic nice bias: pool related compiler tools into one learning entry.
# During a build cc1plus/lto1/as/ld hand off within seconds, so per-name
# learning never sees enough consecutive samples under any single name.
# Matching comms learn under the tag `build` instead (fuzzy keying).
bias_group.build = ^(cc1.*|lto1.*|collect2|as|ld.*)$
