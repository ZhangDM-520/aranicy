# aranicy-collector — scheduler-agnostic BPF per-task statistics collector.
#
# GPL-2.0-only on purpose: the stats transport (scx_stats) is GPL-2.0-only and
# the collector is a standalone package, so the license boundary is the
# package boundary. aranicy itself stays MIT.
[package]
name = "aranicy-collector"
version = "0.3.0"
edition = "2024"
license = "GPL-2.0-only"
rust-version = "1.91"
description = "Scheduler-agnostic BPF per-task statistics collector for aranicy"

# Standalone workspace: excluded from the aranicy root workspace so the MIT
# side keeps its MSRV (1.85) while this side uses scx_stats (needs 1.91).
[workspace]

[[bin]]
name = "aranicy-collectord"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aranicy-procname = { path = "../crates/aranicy-procname" }
aranicy-wire = { path = "../crates/aranicy-wire" }
clap = { version = "4", features = ["derive"] }
libbpf-rs = "0.27"
libc = "0.2"
scx_stats = "1.1.4"
scx_stats_derive = "1.1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
